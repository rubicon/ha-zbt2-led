[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=custom_components.zbt2_led --cov-report=term-missing --cov-fail-under=95"
filterwarnings = ["error"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.zbt2_led"]
combine-as-imports = true
