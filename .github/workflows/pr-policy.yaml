name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  branch-naming:
    name: Branch naming
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev/<issue>-<slug> branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Trusted-automation exemption: Dependabot and release-please cannot
          # use dev/<issue>-<slug> branches. A PR is exempt only when the bot
          # opened it from its own branch in this repository, so a fork or a
          # person cannot claim the exemption by naming a branch. The PR author
          # is checked, not the actor, so a maintainer editing a release PR
          # keeps it exempt. Title and build/test checks stay enforced.
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            case "$AUTHOR:$HEAD_REF" in
              "dependabot[bot]:dependabot/"*|"rubicon-release-please[bot]:release-please--"*)
                echo "Trusted automation ($AUTHOR, $HEAD_REF); branch-naming exempt."
                exit 0
                ;;
            esac
          fi
          if ! printf '%s' "$HEAD_REF" | grep -qE '^dev/[0-9]+-[a-z0-9.-]+$'; then
            echo "Branch '$HEAD_REF' does not match required pattern: dev/<issue-number>-<kebab-slug>" >&2
            exit 1
          fi

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Conventional Commits type prefix on PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|test|ci|refactor|build|perf|revert|style)(\([a-z0-9_.-]+\))?!?: .+'; then
            echo "PR title must start with a Conventional Commits type (feat, fix, chore, docs, test, ci, refactor, build, perf, revert, style), e.g. 'feat: add thing'." >&2
            exit 1
          fi

  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing issue reference in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Trusted-automation exemption, same scope as branch naming:
          # Dependabot and release-please bodies carry a diff or changelog,
          # not an issue reference.
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            case "$AUTHOR:$HEAD_REF" in
              "dependabot[bot]:dependabot/"*|"rubicon-release-please[bot]:release-please--"*)
                echo "Trusted automation ($AUTHOR, $HEAD_REF); issue-link exempt."
                exit 0
                ;;
            esac
          fi
          if ! printf '%s' "$PR_BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "PR body must link its issue with closing syntax, e.g. 'Closes #12'." >&2
            exit 1
          fi
