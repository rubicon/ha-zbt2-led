version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # pytest-homeassistant-custom-component pins an exact Home Assistant
      # release. zha and the rest are the requirements of ZHA and of the
      # components ZHA depends on, which must match that release's manifests,
      # so they all move in one PR. If the grouped bump still fails, take the
      # versions from the new release's manifests.
      home-assistant:
        patterns:
          - "pytest-homeassistant-custom-component"
          - "zha"
          - "zha-quirks"
          - "aiousbwatcher"
          - "ha-silabs-firmware-client"
          - "serialx"
          - "universal-silabs-flasher"
